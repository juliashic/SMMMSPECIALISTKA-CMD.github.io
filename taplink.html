<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Екатерина — Лэш-мастер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    /* Fallback fonts пока грузятся внешние */
    :root {
      --font-serif: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
      --font-sans:  'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<!-- ================================================
     ✏️  ВСЁ ЧТО НУЖНО МЕНЯТЬ — ТОЛЬКО ЗДЕСЬ
     Открой в блокноте, правь текст между кавычками.
     Остальное не трогай!
     ================================================ -->
<script>
const CONFIG = {

  // --- ПРОФИЛЬ ---
  name:     "Екатерина",
  subtitle: "Мастер по наращиванию ресниц",
  city:     "Москва",
  photo:    "images/master.jpg",

  // --- ССЫЛКИ КНОПОК ---
  telegram:  "https://t.me/username",       // ← вставь свой Telegram
  maxUrl:    "https://max.ru/",             // ← вставь ссылку MAX
  pricesUrl: "index.html#services",         // ← ссылка на услуги и цены

  // --- ФОРМА ЗАПИСИ ---
  formNote: "Свяжусь с вами в течение часа для подтверждения 🤍",

  // --- ПОРТФОЛИО ---
  portfolio: [
    "images/work-klassika.png",
    "images/work-2d.png",
    "images/work-3d.png",
    "images/work-1-5d.png",
    "images/work-kukolniy.png",
    "images/work-belichiy.png",
    "images/work-lisiy.png",
  ],

}
</script>
<!-- ================================================
     КОНЕЦ РЕДАКТИРУЕМОГО БЛОКА
     ================================================ -->

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink-light:  #FDF6F6;
    --pink-soft:   #F5E6E6;
    --pink-mid:    #E8CECE;
    --pink-accent: #C9897A;
    --pink-dark:   #A06060;
    --brown:       #7A4F4F;
    --dark:        #2C2020;
    --gray:        #9A8A8A;
    --white:       #FFFFFF;
    --font-serif:  'Playfair Display', Georgia, serif;
    --font-sans:   'Inter', system-ui, sans-serif;
    --radius:      18px;
    --ease:        .35s cubic-bezier(.4,0,.2,1);
  }

  html { font-size: 16px; }

  body {
    font-family: var(--font-sans);
    background: var(--pink-light);
    color: var(--dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }

  /* ── CARD ── */
  .card {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── AVATAR ── */
  .avatar-wrap {
    position: relative;
    margin-bottom: 20px;
  }
  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--white);
    box-shadow: 0 8px 32px rgba(160,96,96,.18);
    display: block;
  }
  .avatar-ring {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px solid var(--pink-accent);
    opacity: .5;
    pointer-events: none;
  }

  /* ── PROFILE TEXT ── */
  .profile-name {
    font-family: var(--font-serif);
    font-size: 1.65rem;
    font-weight: 600;
    color: var(--dark);
    text-align: center;
    line-height: 1.2;
    margin-bottom: 6px;
  }
  .profile-sub {
    font-size: .875rem;
    color: var(--gray);
    text-align: center;
    letter-spacing: .02em;
    margin-bottom: 4px;
  }
  .profile-city {
    font-size: .78rem;
    color: var(--pink-accent);
    text-align: center;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 48px;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--pink-mid), transparent);
    margin: 0 auto 28px;
  }

  /* ── BUTTONS ── */
  .buttons {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
  }

  .btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 20px;
    border-radius: var(--radius);
    font-family: var(--font-sans);
    font-size: .95rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    border: 1.5px solid transparent;
    transition: transform var(--ease), box-shadow var(--ease), background var(--ease);
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.08);
    opacity: 0;
    transition: opacity var(--ease);
  }
  .btn:hover::after { opacity: 1; }
  .btn:active { transform: scale(.98); }

  /* variants */
  .btn-outline {
    background: var(--white);
    border-color: var(--pink-mid);
    color: var(--dark);
    box-shadow: 0 2px 12px rgba(160,96,96,.07);
  }
  .btn-outline:hover {
    border-color: var(--pink-accent);
    box-shadow: 0 4px 20px rgba(160,96,96,.14);
    transform: translateY(-1px);
  }

  .btn-accent {
    background: linear-gradient(135deg, var(--pink-accent), var(--pink-dark));
    color: var(--white);
    box-shadow: 0 6px 24px rgba(160,96,96,.28);
  }
  .btn-accent:hover {
    box-shadow: 0 8px 32px rgba(160,96,96,.38);
    transform: translateY(-2px);
  }

  .btn-ghost {
    background: var(--pink-soft);
    border-color: var(--pink-mid);
    color: var(--brown);
  }
  .btn-ghost:hover {
    background: var(--pink-mid);
    transform: translateY(-1px);
  }

  .btn-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .btn-outline .btn-icon { background: var(--pink-soft); }
  .btn-accent  .btn-icon { background: rgba(255,255,255,.18); }
  .btn-ghost   .btn-icon { background: var(--pink-mid); }

  .btn-icon svg { width: 20px; height: 20px; }

  .btn-label { flex: 1; }
  .btn-label span { display: block; }
  .btn-label .hint {
    font-size: .72rem;
    opacity: .6;
    font-weight: 400;
    margin-top: 1px;
  }

  .btn-arrow {
    margin-left: auto;
    opacity: .35;
    font-size: 1.1rem;
  }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family: var(--font-serif);
    font-size: 1.15rem;
    font-weight: 400;
    font-style: italic;
    color: var(--brown);
    text-align: center;
    margin-bottom: 16px;
    width: 100%;
  }

  /* ── PORTFOLIO GALLERY ── */
  .gallery {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 28px;
  }
  .gallery-item {
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 3/4;
    cursor: pointer;
    position: relative;
    box-shadow: 0 2px 12px rgba(160,96,96,.1);
    transition: transform var(--ease), box-shadow var(--ease);
  }
  .gallery-item:first-child {
    grid-column: 1 / -1;
    aspect-ratio: 16/9;
  }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform var(--ease);
  }
  .gallery-item:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(160,96,96,.2); }
  .gallery-item:hover img { transform: scale(1.04); }
  .gallery-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(44,32,32,.45) 0%, transparent 60%);
    opacity: 0;
    transition: opacity var(--ease);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 12px;
  }
  .gallery-item:hover .gallery-overlay { opacity: 1; }
  .gallery-overlay span {
    color: #fff;
    font-size: .78rem;
    letter-spacing: .05em;
  }

  /* ── LIGHTBOX ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,10,10,.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(6px);
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 85vh;
    border-radius: 16px;
    object-fit: contain;
    box-shadow: 0 20px 80px rgba(0,0,0,.5);
    animation: fadeIn .25s ease;
  }
  .lightbox-close {
    position: absolute;
    top: 18px;
    right: 22px;
    color: rgba(255,255,255,.7);
    font-size: 2rem;
    cursor: pointer;
    line-height: 1;
    transition: color .2s;
  }
  .lightbox-close:hover { color: #fff; }

  /* ── MODAL (форма записи) ── */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,10,10,.55);
    z-index: 90;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    width: 100%;
    max-width: 480px;
    background: var(--white);
    border-radius: 28px 28px 0 0;
    padding: 32px 24px 40px;
    animation: slideUp .35s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  .modal-handle {
    width: 36px; height: 4px;
    background: var(--pink-mid);
    border-radius: 2px;
    margin: 0 auto 24px;
  }
  .modal-title {
    font-family: var(--font-serif);
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--dark);
    margin-bottom: 6px;
  }
  .modal-note {
    font-size: .83rem;
    color: var(--gray);
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: .8rem;
    font-weight: 500;
    color: var(--brown);
    margin-bottom: 6px;
    letter-spacing: .02em;
  }
  .form-input, .form-textarea {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--pink-mid);
    border-radius: 12px;
    font-family: var(--font-sans);
    font-size: .9rem;
    color: var(--dark);
    background: var(--pink-light);
    outline: none;
    transition: border-color var(--ease), box-shadow var(--ease);
    resize: none;
  }
  .form-input:focus, .form-textarea:focus {
    border-color: var(--pink-accent);
    box-shadow: 0 0 0 3px rgba(201,137,122,.12);
  }
  .form-textarea { height: 90px; }

  .form-submit {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--pink-accent), var(--pink-dark));
    color: var(--white);
    border: none;
    border-radius: 14px;
    font-family: var(--font-sans);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(160,96,96,.28);
    transition: transform var(--ease), box-shadow var(--ease);
    margin-top: 8px;
  }
  .form-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 32px rgba(160,96,96,.38);
  }
  .form-submit:active { transform: scale(.99); }

  /* ── SUCCESS ── */
  .form-success {
    display: none;
    text-align: center;
    padding: 20px 0;
  }
  .form-success.show { display: block; }
  .success-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .success-text {
    font-family: var(--font-serif);
    font-size: 1.2rem;
    color: var(--brown);
    margin-bottom: 8px;
  }
  .success-sub { font-size: .85rem; color: var(--gray); }

  /* ── FOOTER ── */
  .footer {
    margin-top: 32px;
    font-size: .72rem;
    color: var(--pink-mid);
    text-align: center;
    letter-spacing: .04em;
  }
</style>

<!-- SVG ICONS -->

<!-- ═══════════════════════════════════════════ -->
<!--                  MAIN                      -->
<!-- ═══════════════════════════════════════════ -->
<div class="card" id="app"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">×</span>
  <img id="lightbox-img" src="" alt="">
</div>

<!-- MODAL FORM -->
<div class="modal-backdrop" id="modal" onclick="handleBackdropClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="form-content">
      <div class="modal-title">Запись на&nbsp;процедуру</div>
      <div class="modal-note" id="modal-note"></div>
      <form onsubmit="submitForm(event)">
        <div class="form-group">
          <label class="form-label">Ваше имя</label>
          <input class="form-input" type="text" placeholder="Как вас зовут?" required>
        </div>
        <div class="form-group">
          <label class="form-label">Телефон или Telegram</label>
          <input class="form-input" type="text" placeholder="+7 900 000-00-00" required>
        </div>
        <div class="form-group">
          <label class="form-label">Пожелания (необязательно)</label>
          <textarea class="form-textarea" placeholder="Какой эффект хотите, удобное время…"></textarea>
        </div>
        <button class="form-submit" type="submit">Отправить заявку ✦</button>
      </form>
    </div>
    <div class="form-success" id="form-success">
      <div class="success-icon">🤍</div>
      <div class="success-text">Заявка принята!</div>
      <div class="success-sub" id="success-sub"></div>
    </div>
  </div>
</div>

<script>
// ── Рендер страницы из CONFIG ──────────────────
function render() {
  const c = CONFIG;

  // modal note
  document.getElementById('modal-note').textContent = c.formNote;
  document.getElementById('success-sub').textContent = c.formNote;

  // portfolio
  const galleryHTML = c.portfolio.map((src, i) => `
    <div class="gallery-item" onclick="openLightbox('${src}')">
      <img src="${src}" alt="Работа ${i+1}" loading="lazy">
      <div class="gallery-overlay"><span>смотреть</span></div>
    </div>
  `).join('');

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="avatar-wrap">
      <img class="avatar" src="${c.photo}" alt="${c.name}">
      <div class="avatar-ring"></div>
    </div>

    <div class="profile-name">${c.name}</div>
    <div class="profile-sub">${c.subtitle}</div>
    <div class="profile-city">✦ ${c.city} ✦</div>
    <div class="divider"></div>

    <div class="buttons">

      <a class="btn btn-outline" href="${c.telegram}" target="_blank">
        <span class="btn-icon" style="color:#2AABEE">
          <svg><use href="#icon-tg"/></svg>
        </span>
        <span class="btn-label">
          <span>Telegram</span>
          <span class="hint">написать мне</span>
        </span>
        <span class="btn-arrow">›</span>
      </a>

      <a class="btn btn-outline" href="${c.maxUrl}" target="_blank">
        <span class="btn-icon" style="color:var(--pink-accent)">
          <svg><use href="#icon-max"/></svg>
        </span>
        <span class="btn-label">
          <span>MAX</span>
          <span class="hint">онлайн-запись</span>
        </span>
        <span class="btn-arrow">›</span>
      </a>

      <button class="btn btn-accent" onclick="openModal()">
        <span class="btn-icon">
          <svg><use href="#icon-calendar"/></svg>
        </span>
        <span class="btn-label">
          <span>Записаться</span>
          <span class="hint" style="opacity:.75">заполнить форму</span>
        </span>
        <span class="btn-arrow" style="opacity:.6">›</span>
      </button>

      <a class="btn btn-ghost" href="${c.pricesUrl}">
        <span class="btn-icon" style="color:var(--pink-accent)">
          <svg><use href="#icon-star"/></svg>
        </span>
        <span class="btn-label">
          <span>Услуги и цены</span>
          <span class="hint">все процедуры</span>
        </span>
        <span class="btn-arrow">›</span>
      </a>

    </div>

    <div class="section-title">Мои работы</div>
    <div class="gallery">${galleryHTML}</div>
  `;
}

// ── Лайтбокс ──────────────────────────────────
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// ── Модальная форма ────────────────────────────
function openModal() {
  document.getElementById('modal').classList.add('open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
function handleBackdropClick(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}
function submitForm(e) {
  e.preventDefault();
  document.getElementById('form-content').style.display = 'none';
  document.getElementById('form-success').classList.add('show');
  setTimeout(closeModal, 2800);
  setTimeout(() => {
    document.getElementById('form-content').style.display = 'block';
    document.getElementById('form-success').classList.remove('show');
    e.target.reset();
  }, 3000);
}

// Закрытие по Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLightbox(); closeModal(); }
});

render();
</script>

<footer class="footer">Екатерина · Лэш-мастер · 2025</footer>

</body>
</html>
